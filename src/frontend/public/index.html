<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MedRequest — Hospital patient communication and concierge request system">
  <title>MedRequest</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="app-header" role="banner">
    <div class="header-content">
      <h1 class="app-title">
        <span class="logo" aria-hidden="true">+</span>
        MedRequest
      </h1>
      <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="role-nav">
        <span class="menu-icon"></span>
      </button>
    </div>

    <nav id="role-nav" class="role-nav" role="navigation" aria-label="Role selector">
      <ul class="role-list">
        <li>
          <a href="#patient" class="role-link" data-role="patient" aria-current="false">
            <span class="role-icon" aria-hidden="true">🧑‍⚕️</span>
            Patient
          </a>
        </li>
        <li>
          <a href="#concierge" class="role-link" data-role="concierge" aria-current="false">
            <span class="role-icon" aria-hidden="true">🛎️</span>
            Concierge
          </a>
        </li>
        <li>
          <a href="#casemanager" class="role-link" data-role="casemanager" aria-current="false">
            <span class="role-icon" aria-hidden="true">📋</span>
            Case Manager
          </a>
        </li>
        <li>
          <a href="#explorer" class="role-link" data-role="explorer" aria-current="false">
            <span class="role-icon" aria-hidden="true">🔬</span>
            Behind the Scenes
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <main id="app" class="app-main" role="main">
    <div class="loading" aria-live="polite">Loading…</div>
  </main>

  <footer class="app-footer" role="contentinfo">
    <p>&copy; 2025 MedRequest Demo</p>
  </footer>

  <!-- Core modules -->
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/personas.js"></script>
  
  <!-- Components -->
  <script src="../js/components/persona-badge.js"></script>
  
  <!-- Views -->
  <script src="../js/views/picker.js"></script>
  <script src="../js/views/patient.js"></script>
  <script src="../js/views/concierge.js"></script>
  <script src="../js/views/casemanager.js"></script>
  <script src="../js/views/explorer.js"></script>
  
  <!-- App bootstrap (must load last) -->
  <script src="../js/app.js"></script>
</body>
</html>
